[Overlay]
; 启用或禁用插件
bEnabled=1

; 字体大小（以 96 DPI 为基准，单位：像素）
iFontSize=16

; 字体名称；中文界面建议使用 Microsoft YaHei UI（微软雅黑 UI）
sFont=Microsoft YaHei UI

; 设为 0 时忽略 Windows 显示缩放
bDpiScaling=1

; 游戏加载完成后，完成提示继续显示的秒数（0 表示主菜单加载完成后立即关闭）
iLingerSeconds=0

; 启动画面图片路径，支持相对路径或绝对路径
; 如果指定文件夹，将从文件夹中随机选择图片
; 支持 jpg、png、bmp，图片宽高比需在 3:1 到 4:3 之间
sSplashImage=SkyLineSplash.jpg

; 设为 0 时禁用启动窗口
bSplash=1

; 启动画面宽度（以 96 DPI 为基准，单位：像素）；高度根据图片自动计算，且不会超出屏幕
iSplashWidth=480

; 设为 1 时只显示进度条，不显示加载状态文字
bBarOnly=0

; 设为 0 时隐藏第二行详细信息
bShowDetail=1

; 文字颜色，RRGGBB 十六进制格式
sTextColor=ECECEC

; 设为 0 时禁用文字阴影或发光效果
bTextShadow=1

; 进度条颜色，RRGGBB 十六进制格式
sBarColor=6EB4E6

; 进度条粗细和长度（以 96 DPI 为基准，单位：像素）；iBarLength=0 表示使用最大长度
iBarHeight=4
iBarLength=360

; 进度条在 Skyrim 游戏窗口中的位置
; 可选：TopLeft、Top、TopRight、Left、Center、Right、BottomLeft、Bottom、BottomRight
sPosition=BottomLeft

; 位置偏移（以 96 DPI 为基准，单位：像素）；正数表示向右或向下
iOffsetX=0
iOffsetY=0

; 实验性功能：在游戏内加载画面中也显示进度条
bLoadingScreens=0

; 设为 0 时禁用 SkyLine.log 日志
bLog=1
