name: Build SkyLine

on:
  push:
    branches:
      - main
    paths:
      - "plugin/**"
      - "config/**"
      - "README.md"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "config/**"
      - "README.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 plugin
    runs-on: windows-2022
    env:
      VCPKG_HOME: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM clang-cl
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1.7"
          directory: ${{ runner.temp }}/llvm

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/plugin/vcpkg_installed
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('plugin/vcpkg.json', 'plugin/vcpkg-configuration.json', 'plugin/overlays/ports/**') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_HOME/vcpkg.exe")) {
            git init "$env:VCPKG_HOME"
            git -C "$env:VCPKG_HOME" remote add origin https://github.com/microsoft/vcpkg.git
            git -C "$env:VCPKG_HOME" fetch --depth 1 origin 175007f70fdc66f6e7de4174a135b4082ba10703
            git -C "$env:VCPKG_HOME" checkout --detach FETCH_HEAD
            & "$env:VCPKG_HOME/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_HOME/vcpkg.exe" install --triplet x64-windows-static --overlay-ports="$env:GITHUB_WORKSPACE/plugin/overlays/ports" --x-manifest-root="$env:GITHUB_WORKSPACE/plugin"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S plugin -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_HOME/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE/plugin/overlays/ports" -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $cmake = Get-Content "plugin/CMakeLists.txt" -Raw
          if ($cmake -notmatch 'project\(\s*SkyLine\s+VERSION\s+(\d+)\.(\d+)\.(\d+)') {
            throw "Unable to read SkyLine version from plugin/CMakeLists.txt"
          }
          $version = $Matches[1] + "." + $Matches[2]
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $releaseName = "SkyLine-$version-$date"
          $package = Join-Path $env:RUNNER_TEMP $releaseName
          $plugins = Join-Path $package "SKSE/Plugins"
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null

          $dll = Join-Path $env:GITHUB_WORKSPACE "build/SkyLine.dll"
          if (!(Test-Path $dll)) {
            throw "Build output not found: $dll"
          }

          Copy-Item -LiteralPath $dll -Destination $plugins
          Copy-Item -LiteralPath "config/SkyLine.ini" -Destination $plugins
          Copy-Item -LiteralPath "config/SkyLineSplash.jpg" -Destination $plugins

          $archive = Join-Path $env:RUNNER_TEMP "$releaseName.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $archive -CompressionLevel Optimal -Force

          "version=$version" >> $env:GITHUB_OUTPUT
          "date=$date" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.release_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_name }}-${{ github.run_number }}
          name: ${{ steps.package.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
