name: Build SkyLine

on:
  push:
    branches:
      - main
    paths:
      - "plugin/**"
      - "config/**"
      - "README.md"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "config/**"
      - "README.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 plugin
    runs-on: windows-2022
    env:
      VCPKG_HOME: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM clang-cl
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ github.workspace }}/plugin/vcpkg_installed
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('plugin/vcpkg.json', 'plugin/vcpkg-configuration.json') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:VCPKG_HOME/vcpkg.exe")) {
            git init "$env:VCPKG_HOME"
            git -C "$env:VCPKG_HOME" remote add origin https://github.com/microsoft/vcpkg.git
            git -C "$env:VCPKG_HOME" fetch --depth 1 origin 175007f70fdc66f6e7de4174a135b4082ba10703
            git -C "$env:VCPKG_HOME" checkout --detach FETCH_HEAD
            & "$env:VCPKG_HOME/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_HOME/vcpkg.exe" install --triplet x64-windows-static-clangcl --overlay-triplets="$env:GITHUB_WORKSPACE/plugin/triplets" --x-manifest-root="$env:GITHUB_WORKSPACE/plugin"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S plugin -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_HOME/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-clangcl -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/plugin/triplets" -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Package plugin
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "SkyLine"
          $plugins = Join-Path $package "SKSE/Plugins"
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null

          $dll = Join-Path $env:GITHUB_WORKSPACE "build/SkyLine.dll"
          if (!(Test-Path $dll)) {
            throw "Build output not found: $dll"
          }

          Copy-Item -LiteralPath $dll -Destination $plugins
          Copy-Item -LiteralPath "config/SkyLine.ini" -Destination $plugins
          Copy-Item -LiteralPath "config/SkyLineSplash.jpg" -Destination $plugins

          $archive = Join-Path $env:RUNNER_TEMP "SkyLine-${{ github.sha }}.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-${{ github.sha }}
          path: ${{ runner.temp }}/SkyLine-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
